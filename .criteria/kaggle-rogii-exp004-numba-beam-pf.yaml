task_id: kaggle-rogii-exp004-numba-beam-pf
goal: |
  Approach A 自前再実装 = Numba JIT Beam x7 (delta +/-2) + Numba Particle Filter
  (ANCC + Z 両方, N=500) + plane-fit imputer + Self-NCC multi-scale + LGB x3 + CB
  を src/rogii/{beam,pf}.py + self-contained Kaggle script として構築、LB 10.5 帯
  単独到達。

  位置づけ: 9 切り戦略 (= public LB 8.x 帯到達、docs/dev/leaderboard.dense.md
  § "9 切り戦略") の **Approach A diversity 源**。現在の Approach B (= karnakbaev
  blend exp005 v2 = LB 10.203 Silver) と独立 stack を作り、exp012 で両 Approach の
  全 OOF を Ridge meta blend → 9.0 帯到達を狙う。単独 LB は 10.2 (= B) より悪化する
  可能性が高いが、それは設計通り (= diversity が目的)。

  本 plan 改訂版 (2026-05-11 14:58): 個別 base model HPO + loss ablation + AG deep
  EDA finding D1 (= b_well 67 cluster categorical encoding) を AC として追加。
  HPO + loss ablation で base 単体性能を線形 lift、D1 で公開上位未活用の
  differentiator を獲得。

