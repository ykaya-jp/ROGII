deliverables:
  - path: src/rogii/cv.py
    purpose: |
      既存 (feat/phase-6-exp010-fold-reform): make_well_folds, compute_typewell_hashes,
      build_edge_q_folds, verify_edge_q_no_leak, build_stratified_edge_q_folds,
      summarize_fold_stratification を継承。 **新規追加**: (1) build_pseudo_test_fold (= C1),
      (2) build_multi_key_stratified_edge_q_folds (= C2 multi-key 拡張),
      (3) compute_adversarial_classifier_oof + apply_adversarial_drop_fold (= C3、
      kernel inline から src 移管),
      (4) compute_b_cluster_balance (= C4 post-hoc balance check helper),
      (5) compute_test_distance_features (= C1 距離関数 helper: z-score + PCA top-10)
  - path: src/rogii/typewell_hash.py
    purpose: cv.py から compute_typewell_hashes を移管 + 13 dup group の hard-coded snapshot で reproducibility 確保
  - path: tests/test_cv_strategies.py
    purpose: tests/exp010/test_smoke.py を継承 + 拡張 — (a) C1 no-leak + F1 b_cluster rep + distance deterministic, (b) C2 multi-key fold balance σ < 0.05, (c) C3 OOF auc + drop 適用 row 数, (d) C4 post-hoc balance check の chi-square test
  - path: docs/research/2026-05-11-cv-strategy-candidates.dense.md
    purpose: 4 CV の数理本質 + 出典 + bin 設計 + ablation 設計 + 既存 exp010 work との関係 (= 日本語)
  - path: scripts/regenerate_oof.py
    purpose: 8 SCORED + exp010 (RUNNING 完走時) = 9 件 × 4 CV = 36 OOF 再生成 pipeline。 各 SCORED kernel の training pipeline を fold-aware に再実行。 Colab/Kaggle Notebook 並列実行を前提
  - path: tools/measure_cv_lb_correlation.py
    purpose: OOF table から各 CV × SCORED の RMSE を読み、 (a) Spearman, (b) Pearson, (c) Leave-One-Out Spearman 平均, (d) bootstrap 1000-iter 95% CI lower bound を計算。 --print-best-spearman で標準出力に best_spearman=<value> を 1 行
  - path: outputs/oof/cv-lb-correlation/oof_table.parquet
    purpose: 9 SCORED × 4 CV + baseline plain GroupKFold = 計 45 OOF 集約表 (column: exp, cv_strategy, oof_rmse, public_lb, fold_rmse_list_json)
  - path: docs/dev/2026-05-11-cv-lb-correlation.md
    purpose: 結果表 = 5 CV (= 4 新規 + baseline) × 4 metric (Spearman, Pearson, LOO, bootstrap CI lower) + 9 SCORED の OOF RMSE 詳細 + 最良 CV 戦略の宣言

