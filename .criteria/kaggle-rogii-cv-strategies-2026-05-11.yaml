risks:
  - id: R1
    description: 9 SCORED × 4 CV = 36 OOF 再生成 = 80+ hr local CPU (= karnakbaev base が 1 fold 30+ min)
    mitigation: Colab/Kaggle Notebook 4-server 並列で wall clock 20-30 hr、 段階的に AC-5 で完走確認のみ。 優先順位: exp008 v2 (= best) + exp005 + exp005 v2 + exp007 + exp010 の 5 件先行、 残り 4 件は後追い
  - id: R2
    description: exp003 (LB 17.510) は failed exp で OOF 価値疑問、 corr 計算で outlier 化
    mitigation: 全 9 件で計算 + exp003 除外版も併記、 robust 性 (= LOO 安定性) で別途検証
  - id: R3
    description: C3 adversarial classifier が 776 wells で test 識別を 100% 学習 = overfit、 P(test|well) が極端
    mitigation: kernel 内既存実装 (= 5-fold StratifiedKFold + LightGBM binary + AUC threshold) を src 移管時にも保持、 OOF 確率で fold 割当、 AUC<0.6 で drop skip
  - id: R4
    description: C2 multi-key stratified の bin 設計 fragmenting
    mitigation: |
      visible_ratio(5) × b_cluster(67) × typewell_n_classes(2) × tail_dir(2) = 1340 bin で fragmenting → **解消版**:
      - visible_ratio: 5 quantile bin
      - b_cluster: 「test 所属 cluster (11373/11855)」 vs 「others」 の 2 値に collapse
      - typewell_n_classes: 「6 class」 vs 「10 class」 の 2 値
      - = 計 5 × 2 × 2 = 20 stratum、 776 wells で stratum 平均 39 wells = stratify 機能
      - tail_dir は marginal balance check のみ (= bin に入れない)
  - id: R5
    description: 9 SCORED は全部 karnakbaev base 流用なので独立性低い、 effective sample size 5-6 件
    mitigation: Spearman は rank-based でサンプル少い場合 variance 大、 multi-metric (Pearson + LOO + bootstrap CI lower) で robust 化、 結果解釈で「9 SCORED は LB 多様性が薄い」 明記
  - id: R6
    description: AC-7 target (= multi-metric 全部 pass) が 4 CV のどれも達成できない可能性
    mitigation: 達成失敗時は postmortem skill fire、 learned/failure-patterns/ 追記、 5+ CV 拡張 or feature engineering 路線を別タスクで提案。 AC-7 を required で残すことで「現実逃避な完了宣言」 を防ぐ
  - id: R7
    description: C1 距離関数の hand-tuning overfit (= 32 metric から PCA top-10 取った時の variance ratio が低いと distance 信頼薄)
    mitigation: PCA variance ratio ≥ 0.5 を C1 fold validity check に組み込み、 不足なら C1 を「該当 CV 不適格」 として correlation 計算から除外 + 設計書に明記
  - id: R8
    description: exp010 既存 build_stratified_edge_q_folds が train_df['target'] 列を要求 (= cv.split に target 渡す) が新規 OOF pipeline で target 取得タイミング不一致
    mitigation: cv.py 内 wrapper で target 列 optional 化、 不在時は dummy zeros 渡し (= GroupKFold は y を見ない仕様)、 単体 test で no-target ケース pass 確認

