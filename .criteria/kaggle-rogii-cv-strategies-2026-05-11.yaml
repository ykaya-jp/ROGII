task_id: kaggle-rogii-cv-strategies-2026-05-11
goal: |
  ROGII の CV-LB correlation を確立し、 9 切り (= LB 8.x 帯到達) のための
  fold 構造改革を完成する。 既存 exp010 = stratified Edge Q + adversarial
  validation drop (= H10 Jensen lower bound 10.77 ft 解消、 σ_fold 0.526→
  0.303 で 42% 削減) を継承し、 4 構造原理が異なる CV (C1 pseudo-test fold
  via kNN / C2 multi-key stratified Edge Q / C3 adversarial validation drop /
  C4 typewell hash + b_cluster post-hoc balance) を src/rogii/cv.py で揃え、
  既存 SCORED 8 件 + RUNNING exp010 = 9 件で全 CV の OOF を再生成、 CV vs
  public LB の multi-metric (Spearman + Pearson + LOO 安定性 + bootstrap 95%
  CI lower) で **最良の CV 戦略を 1 つ確定** する。 これは「優勝路手法の CV
  改善検証」 の前提 = ユーザー指示「local CV が LB と相関するデータ分割
  戦略を見つけたうえで、 優勝路手法の CV が本当に改善しているかを検証」
  + 「やるべきことをやるべきように、 数理的見地で」 への直接応答。

