    2026-05-11 user message 1: 「local CV が LB と相関する、 またかつデータとタスクの
    本質に沿うようなデータ分割戦略を見つけたうえで、 優勝できると思っている手法の
    CV が本当に今より改善しているのかを検証しようよまずは」
    2026-05-11 user message 2: 「やるべきことをやるべきように やってくれ 数理的
    見地に立って」 (= full delegation、 数理的 refine 必須)
  jensen_lower_bound:
    formula: "CV = sqrt(mean(RMSE^2) + var(RMSE_per_fold))"
    exp007_observed: "mean(RMSE) ≈ 10.71, σ_fold ≈ 1.175 → CV ≈ 10.77 ft 天井"
