[project]
name = "rogii-wellbore-geology-prediction"
version = "0.0.1"
description = "Kaggle time-series competition: rogii-wellbore-geology-prediction"
requires-python = ">=3.11"
dependencies = [
    "kagglib",
    "kaggle>=1.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mlflow>=2.16",
    "optuna>=4.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    # Time-series specific
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "catboost>=1.2",
    "darts>=0.30",
    "sktime>=0.34",
    "statsforecast>=2.0",
    "tsfresh>=0.21",
    "prophet>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=4.0",
    "nbstripout>=0.7",
]

[tool.uv.sources]
kagglib = { path = "../_shared/kagglib", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rogii"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
